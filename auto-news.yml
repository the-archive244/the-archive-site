name: THE ARCHIVE — corrigir e publicar automaticamente
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Corrigir site e preservar matérias
        run: python scripts/repair_site.py
      - name: Pesquisar e publicar uma nova matéria, se houver
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/auto_publish.py
      - name: Corrigir novamente após publicação
        run: python scripts/repair_site.py
      - name: Salvar alterações no GitHub
        run: |
          git config user.name "THE ARCHIVE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles index.html noticias.html scripts .github/workflows/auto-news.yml
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "auto: corrigir site e atualizar matérias"
            git push
          fi
